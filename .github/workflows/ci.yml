name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: python -m pip install -r ai-gateway/requirements.txt
      - run: python -m unittest discover -s ai-gateway -p 'test_*.py' -q
      - run: python -m unittest discover -s nas-knowledge-service -p 'test_*.py' -q
      - run: python -m unittest discover -s scripts -p 'test_*.py' -q
      - run: bash -n scripts/install.sh scripts/doctor.sh
      - run: bash scripts/install.sh --dry-run --skip-packages --non-interactive
      - run: python scripts/build_package.py 0.1.0-ci
